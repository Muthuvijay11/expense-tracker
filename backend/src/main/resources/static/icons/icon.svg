<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.4"/>
  <!-- Central glow circle -->
  <circle cx="256" cy="256" r="160" fill="#10b981" opacity="0.08" filter="url(#glow)"/>
  <!-- Wallet Body -->
  <rect x="112" y="160" width="288" height="208" rx="28" fill="#1e293b" stroke="#334155" stroke-width="8"/>
  <!-- Wallet Flap -->
  <path d="M112 188 C112 160, 400 160, 400 188 L400 216 L112 216 Z" fill="#0f172a"/>
  <!-- Decorative Accent Card Edge -->
  <rect x="144" y="132" width="224" height="40" rx="12" fill="url(#accentGrad)"/>
  <!-- Wallet Pocket Clasp -->
  <rect x="296" y="236" width="112" height="56" rx="18" fill="url(#accentGrad)"/>
  <!-- Clasp Coin / Button -->
  <circle cx="360" cy="264" r="12" fill="#ffffff" filter="url(#glow)"/>
  <!-- Coin symbol -->
  <circle cx="216" cy="264" r="28" fill="#10b981" opacity="0.2"/>
  <text x="216" y="275" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#10b981" text-anchor="middle">$</text>
</svg>
