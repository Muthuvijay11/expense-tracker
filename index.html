<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Expense & Budget Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="bg-atmosphere"></div>
<div class="toast-container" id="toastContainer"></div>

<!-- Main Container -->
<div style="position:relative; z-index:1; max-width:1360px; margin:0 auto; padding:24px 20px 60px;">

  <!-- Header -->
  <header style="display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; flex-wrap:wrap; gap:16px;">
    <div>
      <h1 style="font-size:28px; font-weight:700; letter-spacing:-0.5px; display:flex; align-items:center; gap:12px;">
        <span style="width:40px;height:40px;border-radius:12px;background:var(--accent-glow);display:flex;align-items:center;justify-content:center;">
          <i class="fa-solid fa-wallet" style="color:var(--accent);font-size:18px;"></i>
        </span>
        SpendWise
      </h1>
      <p style="color:var(--text-muted); font-size:13px; margin-top:4px; margin-left:52px;" id="headerDate"></p>
    </div>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="btn-ghost" onclick="exportData()" aria-label="Export data">
        <i class="fa-solid fa-download" style="margin-right:6px;"></i> Export
      </button>
      <button class="btn-primary" onclick="openModal('add')" aria-label="Add new transaction">
        <i class="fa-solid fa-plus"></i> Add Transaction
      </button>
    </div>
  </header>

  <!-- Stats Row -->
  <div class="stats-grid" style="display:grid; grid-template-columns:repeat(4, 1fr); gap:16px; margin-bottom:28px;">
    <div class="card stat-card income" style="padding:20px;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div>
          <p style="color:var(--text-muted); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px;">Income</p>
          <p id="statIncome" class="animate-value" style="font-family:'Space Grotesk'; font-size:26px; font-weight:700; margin-top:6px;">$0.00</p>
        </div>
        <div class="stat-icon"><i class="fa-solid fa-arrow-trend-up"></i></div>
      </div>
      <p style="color:var(--text-muted); font-size:11px; margin-top:8px;" id="statIncomeChange"></p>
    </div>
    <div class="card stat-card expense" style="padding:20px;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div>
          <p style="color:var(--text-muted); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px;">Expenses</p>
          <p id="statExpense" class="animate-value" style="font-family:'Space Grotesk'; font-size:26px; font-weight:700; margin-top:6px;">$0.00</p>
        </div>
        <div class="stat-icon"><i class="fa-solid fa-arrow-trend-down"></i></div>
      </div>
      <p style="color:var(--text-muted); font-size:11px; margin-top:8px;" id="statExpenseChange"></p>
    </div>
    <div class="card stat-card balance" style="padding:20px;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div>
          <p style="color:var(--text-muted); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px;">Net Balance</p>
          <p id="statBalance" class="animate-value" style="font-family:'Space Grotesk'; font-size:26px; font-weight:700; margin-top:6px;">$0.00</p>
        </div>
        <div class="stat-icon"><i class="fa-solid fa-scale-balanced"></i></div>
      </div>
      <p style="color:var(--text-muted); font-size:11px; margin-top:8px;" id="statBalanceNote"></p>
    </div>
    <div class="card stat-card savings" style="padding:20px;">
      <div style="display:flex; align-items:flex-start; justify-content:space-between;">
        <div>
          <p style="color:var(--text-muted); font-size:12px; font-weight:500; text-transform:uppercase; letter-spacing:0.5px;">Savings Rate</p>
          <p id="statSavings" class="animate-value" style="font-family:'Space Grotesk'; font-size:26px; font-weight:700; margin-top:6px;">0%</p>
        </div>
        <div class="stat-icon"><i class="fa-solid fa-piggy-bank"></i></div>
      </div>
      <p style="color:var(--text-muted); font-size:11px; margin-top:8px;" id="statSavingsNote"></p>
    </div>
  </div>

  <!-- Main Grid -->
  <div class="main-grid" style="display:grid; grid-template-columns:1fr 400px; gap:24px;">

    <!-- Left Column -->
    <div style="display:flex; flex-direction:column; gap:24px;">

      <!-- Chart Section -->
      <div class="card" style="padding:24px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
          <h3 style="font-size:16px; font-weight:600;">Spending Overview</h3>
          <div style="display:flex; gap:4px; background:var(--bg-primary); border-radius:10px; padding:3px;">
            <button class="tab-btn active" data-chart="weekly" onclick="switchChart('weekly', this)">Weekly</button>
            <button class="tab-btn" data-chart="monthly" onclick="switchChart('monthly', this)">Monthly</button>
            <button class="tab-btn" data-chart="category" onclick="switchChart('category', this)">By Category</button>
          </div>
        </div>
        <div style="position:relative; height:280px;">
          <canvas id="mainChart"></canvas>
        </div>
      </div>

      <!-- Transactions Section -->
      <div class="card" style="padding:24px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px;">
          <h3 style="font-size:16px; font-weight:600;">Recent Transactions</h3>
          <div style="display:flex; align-items:center; gap:8px;">
            <div style="position:relative;">
              <i class="fa-solid fa-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:12px;"></i>
              <input type="text" class="form-input" id="searchInput" placeholder="Search transactions..." style="padding-left:32px; width:200px; font-size:13px;" oninput="renderTransactions()">
            </div>
          </div>
        </div>
        <!-- Filter pills -->
        <div id="filterPills" style="display:flex; gap:6px; margin-bottom:16px; flex-wrap:wrap;"></div>
        <!-- Transaction list -->
        <div id="txList" style="display:flex; flex-direction:column; gap:4px; max-height:420px; overflow-y:auto; padding-right:4px;"></div>
      </div>
    </div>

    <!-- Right Column -->
    <div style="display:flex; flex-direction:column; gap:24px;">

      <!-- Budget Section -->
      <div class="card" style="padding:24px;">
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
          <h3 style="font-size:16px; font-weight:600;">Monthly Budgets</h3>
          <button class="btn-ghost" onclick="openModal('budget')" style="font-size:12px; padding:6px 12px;">
            <i class="fa-solid fa-sliders" style="margin-right:4px;"></i> Manage
          </button>
        </div>
        <div id="budgetList" style="display:flex; flex-direction:column; gap:16px;"></div>
      </div>

      <!-- Category Breakdown (Doughnut) -->
      <div class="card" style="padding:24px;">
        <h3 style="font-size:16px; font-weight:600; margin-bottom:20px;">Category Breakdown</h3>
        <div style="position:relative; height:220px; display:flex; align-items:center; justify-content:center;">
          <canvas id="doughnutChart"></canvas>
        </div>
        <div id="doughnutLegend" style="margin-top:16px; display:flex; flex-wrap:wrap; gap:8px 16px; justify-content:center;"></div>
      </div>

      <!-- Quick Insights -->
      <div class="card" style="padding:24px;">
        <h3 style="font-size:16px; font-weight:600; margin-bottom:16px;">Quick Insights</h3>
        <div id="insightsList" style="display:flex; flex-direction:column; gap:12px;"></div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Transaction Modal -->
<div class="modal-overlay" id="txModal" onclick="if(event.target===this)closeModal('txModal')">
  <div class="modal-content" role="dialog" aria-label="Transaction form">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
      <h3 id="txModalTitle" style="font-size:18px; font-weight:600;">Add Transaction</h3>
      <button class="btn-icon" onclick="closeModal('txModal')" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <form id="txForm" onsubmit="handleTxSubmit(event)" style="display:flex; flex-direction:column; gap:16px;">
      <input type="hidden" id="txId">
      <!-- Type toggle -->
      <div>
        <label style="font-size:12px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Type</label>
        <div style="display:flex; gap:8px;">
          <button type="button" class="tab-btn active" id="typeExpense" onclick="setTxType('expense')" style="flex:1; padding:10px;">Expense</button>
          <button type="button" class="tab-btn" id="typeIncome" onclick="setTxType('income')" style="flex:1; padding:10px;">Income</button>
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Description</label>
        <input type="text" class="form-input" id="txDesc" placeholder="e.g. Grocery shopping" required>
      </div>
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
        <div>
          <label style="font-size:12px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Amount ($)</label>
          <input type="number" class="form-input" id="txAmount" placeholder="0.00" step="0.01" min="0.01" required>
        </div>
        <div>
          <label style="font-size:12px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Date</label>
          <input type="date" class="form-input" id="txDate" required>
        </div>
      </div>
      <div>
        <label style="font-size:12px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Category</label>
        <select class="form-input" id="txCategory" required></select>
      </div>
      <div>
        <label style="font-size:12px; font-weight:500; color:var(--text-secondary); display:block; margin-bottom:8px;">Notes (optional)</label>
        <input type="text" class="form-input" id="txNotes" placeholder="Any additional notes...">
      </div>
      <div style="display:flex; gap:12px; margin-top:8px;">
        <button type="button" class="btn-ghost" onclick="closeModal('txModal')" style="flex:1;">Cancel</button>
        <button type="submit" class="btn-primary" style="flex:1; justify-content:center;" id="txSubmitBtn">Add Transaction</button>
      </div>
    </form>
  </div>
</div>

<!-- Budget Management Modal -->
<div class="modal-overlay" id="budgetModal" onclick="if(event.target===this)closeModal('budgetModal')">
  <div class="modal-content" role="dialog" aria-label="Budget management">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:24px;">
      <h3 style="font-size:18px; font-weight:600;">Manage Budgets</h3>
      <button class="btn-icon" onclick="closeModal('budgetModal')" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="budgetFormList" style="display:flex; flex-direction:column; gap:14px; max-height:400px; overflow-y:auto; padding-right:4px;"></div>
    <button class="btn-primary" onclick="saveBudgets()" style="width:100%; justify-content:center; margin-top:20px;">
      <i class="fa-solid fa-check"></i> Save Budgets
    </button>
  </div>
</div>

<script src="script.js"></script>

</body>
</html>
